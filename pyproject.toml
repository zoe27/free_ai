[project]
name = "free-ai-gateway"
version = "0.1.0"
description = "自建免费 AI API 聚合网关，OpenAI 兼容接口"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
